name: Send queued outreach

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send-queued-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: Production

    steps:
      - name: Call Supabase queued outreach sender
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing SUPABASE_URL secret"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing CRON_SECRET secret"
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --request POST "${SUPABASE_URL%/}/functions/v1/send-queued-outreach" \
            --header "content-type: application/json" \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --data '{"source":"github-actions-scheduler"}'
