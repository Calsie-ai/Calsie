name: Send queued outreach

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send-queued-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call Supabase queued outreach sender
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing GitHub secret SUPABASE_URL"
            exit 1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing GitHub secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --request POST "${SUPABASE_URL%/}/functions/v1/send-queued-outreach" \
            --header "content-type: application/json" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --data '{"source":"github-actions-scheduler"}'
