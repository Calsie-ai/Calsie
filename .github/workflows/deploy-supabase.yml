name: Deploy Calsie application functions

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "!supabase/functions/*apify*/**"
      - "!supabase/functions/_shared/*apify*"
      - "supabase/application-functions.txt"
      - "scripts/deploy_application_functions.py"
      - "scripts/tests/test_deploy_application_functions.py"
      - ".github/workflows/deploy-supabase.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "!supabase/functions/*apify*/**"
      - "!supabase/functions/_shared/*apify*"
      - "supabase/application-functions.txt"
      - "scripts/deploy_application_functions.py"
      - "scripts/tests/test_deploy_application_functions.py"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calsie-application-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test deployment boundaries
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate application function list
        run: python3 scripts/deploy_application_functions.py --check

  deploy-application:
    needs: validate
    # Activation is a separate decision after backend/schema review.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.CALSIE_APP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Deploy reviewed application functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 scripts/deploy_application_functions.py --deploy
